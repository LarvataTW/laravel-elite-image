name: Build And Release Docker Images

on:
  push:
    # Publish `v1.2.3` tags as releases.
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: laravel-elite-image
  GITHUB_OWNER: larvatatw
  DOCKERHUB_OWNER: larvata

jobs:

  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      matrix: ${{ steps.get_version.outputs.matrix }}
    steps:
      - name: Save tag to env
        run: echo "TAG=${GITHUB_REF/refs\/tags\//}" >> ${GITHUB_ENV}
      - name: Get version and build matrix
        id: get_version
        run: |
          VERSION_LIST=(5.6 7.2 7.3 7.4 7.4-fpm 8.0 8.1 8.3 8.4)
          for context in ${VERSION_LIST[@]}; do
            if [ $(echo ${{ env.TAG }} | grep -c "php${context}") = "1" ]; then
              echo "version=${context}" >> $GITHUB_OUTPUT
              major=$(echo "${context}" | cut -d. -f1)
              minor=$(echo "${context}" | cut -d. -f2)
              if [ "${major}" -ge 9 ] 2>/dev/null || ([ "${major}" -eq 8 ] && [ "${minor}" -ge 4 ]) 2>/dev/null; then
                echo 'matrix=[{"db":"mysql","suffix":""},{"db":"pgsql","suffix":"-pgsql"}]' >> $GITHUB_OUTPUT
              else
                echo 'matrix=[{"db":"mysql","suffix":""}]' >> $GITHUB_OUTPUT
              fi
              break
            fi
          done

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v3
        with:
          # list of Docker images to use as base name for tags
          images: |
            ${{ env.DOCKERHUB_OWNER }}/${{ env.IMAGE_NAME }}
          # ghcr.io/${{ env.GITHUB_OWNER }}/${{ env.IMAGE_NAME }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=semver,pattern={{version}},suffix=${{ matrix.suffix }}
            type=match,prefix=latest-,pattern=php(.*),suffix=${{ matrix.suffix }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v2
        with:
          push: true
          platforms: linux/amd64,linux/arm64/v8
          context: ${{ needs.prepare.outputs.version }}/
          build-args: |
            DB_TYPE=${{ matrix.db }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
